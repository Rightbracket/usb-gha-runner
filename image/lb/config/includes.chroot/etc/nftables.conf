#!/usr/sbin/nft -f
# Inbound from the LAN: the web page (80, 443), mDNS, DHCP replies, ping, and
# port 22 only while SSH is turned on (ghr-agent adds it to @tcp_open). From
# job containers: only the registry mirror. Outbound is open because jobs
# need it. Docker manages its own tables; only ours is reset.
table inet ghr
delete table inet ghr

table inet ghr {
  set tcp_open {
    type inet_service
    elements = { 80, 443 }
  }

  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    # Job containers sit on the Docker bridges. They may reach only the
    # registry mirror on the host, never the web page, SSH or anything else.
    iifname { "docker0", "br-*" } tcp dport 5000 accept
    iifname { "docker0", "br-*" } meta l4proto { icmp, ipv6-icmp } accept
    iifname { "docker0", "br-*" } drop
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport 5353 accept
    udp dport { 68, 546 } accept
    tcp dport @tcp_open accept
  }
}
