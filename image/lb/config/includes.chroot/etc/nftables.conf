#!/usr/sbin/nft -f
# Inbound: the web page (80, 443), mDNS, DHCP replies, ping, and port 22
# only while SSH is turned on (ghr-agent adds it to @tcp_open). Outbound is
# open because jobs need it. Docker manages its own tables; only ours is reset.
table inet ghr
delete table inet ghr

table inet ghr {
  set tcp_open {
    type inet_service
    elements = { 80, 443 }
  }

  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    iifname "docker0" accept
    iifname "br-*" accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport 5353 accept
    udp dport { 68, 546 } accept
    tcp dport @tcp_open accept
  }
}
