# Turned on from the web page. Key-only, as the "ghr" admin user. The host
# key and authorized keys live on /data so they survive reboots.
HostKey /data/etc/ghr-ssh/ssh_host_ed25519_key
AuthorizedKeysFile /data/etc/ghr-ssh/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers ghr
